x-application: &application
  image: finance-reconciliation-ai-agent:local
  env_file:
    - path: .env
      required: false
  volumes:
    - ./data:/app/data

services:
  api:
    <<: *application
    build:
      context: .
    command:
      - uvicorn
      - app.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"

  streamlit:
    <<: *application
    command:
      - streamlit
      - run
      - app/ui.py
      - --server.address=0.0.0.0
      - --server.port=8501
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"
